<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yeastie</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background-color: #ffffff;
      color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      text-align: center;
    }

    h1 {
      margin: 0 0 2rem 0;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: lowercase;
      color: #222222;
    }

    .loaf-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .loaf-image {
      max-width: 60%;
      height: auto;
      display: block;
      margin: 0 auto;
      object-fit: contain;
      user-select: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>yeastie</h1>
    <div class="loaf-container">
      <img src="sourdoughloaf.png" alt="Yeastie artisan sourdough loaf" class="loaf-image" />
    </div>
  </main>
</body>
</html>
